<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楚雄彝州 · 家乡风光</title>
  <link rel="stylesheet" href="css/hometown.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="logo" href="#">彝州楚雄</a>
      <nav class="main-nav">
        <a href="#scenery">风光</a>
        <a href="#food">美食</a>
      </nav>
    </div>
  </header>
  <main>
    <section id="scenery">
      <h2>六处风光</h2>
      <div class="card-grid">
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Yi%20ethnic%20ancient%20town%20at%20night%2C%20warm%20lanterns%20and%20bonfire%2C%20Chuxiong%20Yunnan&image_size=landscape_16_9" alt="彝人古镇">
          <h3>彝人古镇</h3>
          <p>入夜篝火打跳，火把节全城欢腾。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Yuanmou%20earth%20forest%2C%20eroded%20clay%20pillars%2C%20blue%20sky%2C%20Yunnan%20geopark&image_size=landscape_16_9" alt="元谋土林">
          <h3>元谋土林</h3>
          <p>百万年雕出的土柱森林，日落最出片。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Green%20mountain%20forest%20with%20camellia%20flowers%2C%20misty%20morning%2C%20Yunnan&image_size=landscape_16_9" alt="紫溪山">
          <h3>紫溪山</h3>
          <p>天然氧吧，冬春满山茶花。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Deep%20canyon%20rift%20with%20steep%20cliffs%20and%20green%20vegetation%2C%20Yunnan&image_size=landscape_16_9" alt="己衣大裂谷">
          <h3>己衣大裂谷</h3>
          <p>地球裂缝，绝壁深涧震撼人心。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Yi%20ethnic%20mountain%20village%2C%20colorful%20embroidery%2C%20terraced%20green%20fields%2C%20Yunnan&image_size=landscape_16_9" alt="咪依噜风情谷">
          <h3>咪依噜风情谷</h3>
          <p>喝拦门酒、跳左脚舞的彝家寨子。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Totem%20stone%20pillars%20with%20sun%20carvings%2C%20cultural%20plaza%2C%20blue%20sky&image_size=landscape_16_9" alt="十月太阳历文化园">
          <h3>太阳历文化园</h3>
          <p>图腾柱广场，读懂彝族的十月太阳历。</p>
        </article>
      </div>
    </section>
    <section id="food">
      <h2>三样味道</h2>
      <div class="card-grid">
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Yunnan%20wild%20mushroom%20hotpot%2C%20steaming%20pot%2C%20food%20photography&image_size=landscape_4_3" alt="野生菌火锅">
          <h3>野生菌火锅</h3>
          <p>雨季限定，松茸鸡枞一锅鲜。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Goat%20meat%20soup%20hot%20pot%2C%20steaming%2C%20Yunnan%20ethnic%20style&image_size=landscape_4_3" alt="彝家羊汤锅">
          <h3>彝家羊汤锅</h3>
          <p>黑山羊炖到汤色乳白，蘸糊辣椒。</p>
        </article>
        <article class="card">
          <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Buckwheat%20cakes%20with%20honey%20drizzling%2C%20rustic%20Yunnan%20snack&image_size=landscape_4_3" alt="苦荞粑粑蘸蜂蜜">
          <h3>苦荞粑粑蘸蜂蜜</h3>
          <p>微苦荞饼遇山花蜜，彝家老味道。</p>
        </article>
      </div>
    </section>
  </main>
  <footer><p>课程演示案例 · 响应式专题页</p></footer>
</body>
</html>
